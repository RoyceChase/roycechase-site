<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>iMini · 外形模型预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#161617;color:#f5f5f7;font-family:system-ui,"Microsoft YaHei",sans-serif}main{max-width:1180px;margin:auto;padding:36px 28px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #303033;padding-bottom:24px}.eyebrow{color:#2997ff;font-size:12px;letter-spacing:.15em}h1{margin:9px 0;font-size:clamp(26px,4vw,42px);letter-spacing:-.04em}header p{color:#aaaab3;font-size:14px;line-height:1.7;max-width:460px}.badge{border:1px solid #39393e;padding:8px 12px;border-radius:30px;font-size:12px;color:#aaaab3}.viewport{height:490px;position:relative;overflow:hidden;perspective:1100px;touch-action:none;cursor:grab;border:1px solid #303033;border-radius:22px;margin-top:28px;background:radial-gradient(ellipse at 50% 60%,#29292e 0, #1c1c1f 40%,#19191b 75%)}.viewport:active{cursor:grabbing}.viewport:focus-visible,button:focus-visible{outline:2px solid #2997ff;outline-offset:4px}.hint{position:absolute;top:22px;left:24px;font-size:12px;color:#90909b}.axis{position:absolute;bottom:22px;right:24px;color:#777781;font-size:12px}.model{position:absolute;left:50%;top:51%;width:0;height:0;transform-style:preserve-3d}.part{position:absolute;transform-style:preserve-3d}.face{position:absolute;backface-visibility:hidden}.surface{width:320px;height:300px;left:-160px;top:-150px;border-radius:25px}.top{transform:translateY(-40px) rotateX(90deg);background:linear-gradient(125deg,#e0e1e0,#c2c6c8 42%,#b2b8bb);border:1px solid #e7e9e9;box-shadow:inset 0 0 0 2px #fff2}.bottom{transform:translateY(40px) rotateX(-90deg);background:linear-gradient(130deg,#303136,#45464b);border:1px solid #66686c}.side-panel{background:linear-gradient(0deg,#8c959d,#b5bdc2 35%,#c6ccce 85%,#e0e3e4);border-block:1px solid #929ba1}.details{height:80px;width:270px;left:-135px;top:-40px}.front{transform:translateZ(150.7px)}.rear{transform:translateZ(-150.7px) rotateY(180deg);background:linear-gradient(#34373c,#24262b);border-radius:3px}.power{width:24px;height:24px;position:absolute;right:13px;top:29px;border:1px solid #e5e8e9;border-radius:50%;box-shadow:0 0 0 1px #90999f}.power:after{content:"";position:absolute;left:10px;top:7px;width:3px;height:3px;border-radius:50%;background:#e8eeee}.brand{position:absolute;width:48px;height:48px;left:136px;top:126px;opacity:.8}.vents{width:238px;height:60px;left:-119px;top:-30px;display:flex;gap:7px;align-items:center;justify-content:center}.vents-left{transform:translateX(-160.8px) rotateY(-90deg)}.vents-right{transform:translateX(160.8px) rotateY(90deg)}.vent{width:102px;height:24px;border-radius:5px;background:repeating-linear-gradient(90deg,transparent 0 2px,#25282c 2px 3px),repeating-linear-gradient(0deg,#646b70 0 2px,#202428 2px 3px);border:1px solid #8d979c}.port{position:absolute;background:#090b10;border:2px solid #777c80;box-shadow:0 1px 1px #ffffff44}.port:after{position:absolute;color:#bbb;font-size:5px;white-space:nowrap;left:0;top:-10px}.usb{width:27px;height:10px}.usb:before{content:"";position:absolute;left:2px;right:2px;bottom:1px;height:3px;background:#3d5670}.typec{width:19px;height:7px;border-radius:5px}.jack{width:10px;height:10px;border-radius:50%}.display{width:11px;height:25px}.ethernet{width:31px;height:24px}.ethernet:before{content:"";position:absolute;left:4px;right:4px;top:2px;height:5px;background:repeating-linear-gradient(90deg,#cbb774 0 1px,transparent 1px 3px)}.ethernet:after{content:"2.5G"}.label{position:absolute;color:#c4c7cb;font-size:5px;top:14px}.foot{position:absolute;width:58px;height:18px;border-radius:20px;background:linear-gradient(#52545a,#25262c);border:2px solid #22242a;box-shadow:0 0 0 3px #606267;transform:rotate(-43deg)}.screw{position:absolute;width:5px;height:5px;border-radius:50%;background:#c9b486;box-shadow:0 0 0 1px #716647}.grille{position:absolute;width:200px;height:200px;left:60px;top:50px}.underside-label{position:absolute;left:105px;bottom:14px;font-size:5px;letter-spacing:1px;color:#94969a}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:20px}button{background:#232326;border:1px solid #3b3b40;border-radius:9px;color:#ddd;padding:11px 16px;cursor:pointer;font:inherit;font-size:13px}button:hover,button[aria-pressed=true]{border-color:#2997ff;color:#6ab7ff}label{font-size:12px;color:#aaa;display:flex;align-items:center;gap:10px;margin-left:auto}input{accent-color:#2997ff;width:110px}aside{color:#92929d;font-size:13px;line-height:1.9;margin-top:22px;max-width:800px}.specs{display:flex;gap:30px;color:#b8b8c1;font-size:12px;margin-top:18px}.specs span{color:#6f6f7b;margin-right:8px}@media(max-width:600px){main{padding:22px 16px}header{align-items:start}.badge{display:none}.viewport{height:370px}.hint{left:16px;font-size:11px}label{margin-left:0}.specs{gap:16px;flex-wrap:wrap}}
.side-panel{border:0}
.rear{height:62px;top:-27px;border-radius:8px;background:linear-gradient(115deg,#303136,#25262a 65%,#313238);box-shadow:inset 0 1px 0 #0008}
.rear:before{content:"";position:absolute;left:-3px;right:-3px;top:-13px;height:14px;border-radius:7px 7px 2px 2px;background:linear-gradient(#e1e5e6,#bdc6cb 70%,#929ba2);box-shadow:0 1px 0 #dce1e5}
.rear .port{scale:.78;transform-origin:center center;border-color:#969b9f;border-top-color:#e0e4e6;box-shadow:0 1px 1px #000a}
.rear .label{top:12px;font-size:4.5px}
.rear .ethernet:after{font-size:5.5px;top:-12px}
.vent{height:18px;border:1px solid #555a5f;border-radius:5px;background-color:#101115;background-image:linear-gradient(165deg,#ffffff20,transparent 38%,#0006 65%,#ffffff12),repeating-linear-gradient(45deg,transparent 0 1.1px,#555b61 1.2px 1.7px,transparent 1.8px 3px),repeating-linear-gradient(-45deg,transparent 0 1.1px,#373c42 1.2px 1.7px,transparent 1.8px 3px);box-shadow:inset 0 1px 2px #000,inset 0 -1px 1px #a2aab02b,0 1px 0 #d9e0e333}
.power{background:linear-gradient(135deg,#bfc8cc,#a5afb5);border-color:#dbe1e4;box-shadow:0 0 0 1px #69757e,0 1.5px 2px #34414b66,inset 0 1px 1.5px #ffffff91,inset 0 -1px 2px #6b788180}
.power:after{left:50%;top:50%;transform:translate(-50%,-50%);background:#f4f8f9;box-shadow:0 0 1px #ffffff66}
.brand{opacity:1;overflow:visible}
</style>
<main>
<header><div><div class="eyebrow">HOMELAB / DEVICE STUDY 01</div><h1>机械革命 iMini</h1><p>银色金属机身 · 外形还原预览<br>根据提供的多角度照片建模，尺寸为估算比例。</p></div><div class="badge">CSS 3D · 可交互模型</div></header>
<div class="viewport" id="viewport" tabindex="0" role="group" aria-label="迷你主机三维预览，可拖动或使用方向键旋转">
<span class="hint">拖动旋转 · 方向键调整 · 按钮查看各面</span><div class="model" id="model">
<div class="surface face top"><svg class="brand" viewBox="0 0 60 60" role="img" aria-label="深灰色对称几何标志">
<defs>
  <path id="emblem-half" d="M0 0H60V8.715L24 29.5V35.5L0 49.356Z"/>
  <path id="emblem-other-half" d="M60 60H0V51.285L36 30.5V24.5L60 10.644Z"/>
  <clipPath id="emblem-outline"><path d="M30 3 53.383 16.5V43.5L30 57 6.617 43.5V16.5Z"/></clipPath>
</defs>
<g clip-path="url(#emblem-outline)" fill="#454545"><use href="#emblem-half"/><use href="#emblem-other-half"/></g>
</svg></div>
<div class="surface face bottom"><svg class="grille" viewBox="0 0 200 200" aria-hidden="true"></svg>
<i class="foot" style="left:12px;top:25px"></i><i class="foot" style="right:12px;top:25px;transform:rotate(43deg)"></i><i class="foot" style="left:12px;bottom:25px;transform:rotate(43deg)"></i><i class="foot" style="right:12px;bottom:25px"></i><i class="screw" style="left:70px;top:58px"></i><i class="screw" style="right:70px;top:58px"></i><i class="screw" style="left:70px;bottom:58px"></i><i class="screw" style="right:70px;bottom:58px"></i><span class="underside-label">iMINI / VENTILATION</span></div>
<div id="shell" class="part"></div>
<div class="face details front"><div class="power"></div></div>
<div class="face details rear"><i class="port jack" style="left:9px;top:37px"></i><span class="label" style="left:7px">DC IN</span><i class="port typec" style="left:35px;top:37px"></i><span class="label" style="left:36px">USB-C</span><i class="port jack" style="left:69px;top:37px"></i><span class="label" style="left:68px">AUDIO</span><i class="port display" style="left:98px;top:32px"></i><span class="label" style="left:98px">DP</span><i class="port display" style="left:126px;top:32px"></i><span class="label" style="left:123px">HDMI</span><i class="port usb" style="left:153px;top:29px"></i><i class="port usb" style="left:153px;top:45px"></i><i class="port ethernet" style="left:194px;top:32px"></i><i class="port ethernet" style="left:231px;top:32px"></i></div>
<div class="face vents vents-left"><i class="vent"></i><i class="vent"></i></div><div class="face vents vents-right"><i class="vent"></i><i class="vent"></i></div>
</div><span class="axis" id="angle" aria-hidden="true"></span></div>
<div class="controls"><button data-view="front">正面</button><button data-view="rear">背部接口</button><button data-view="top">顶部</button><button data-view="bottom">底部风栅</button><button id="auto" aria-pressed="false">自动旋转</button><button data-view="reset">重置</button><label>缩放<input id="zoom" aria-label="模型缩放" type="range" min="60" max="125" value="100"></label></div>
<div class="specs"><div><span>外壳</span>银色圆角</div><div><span>背部</span>双网口 · 显示接口 · USB</div><div><span>底部</span>六边形风栅 · 四脚垫</div></div>
<aside>模型按照片还原轮廓与主要可见细节，非精确工业 CAD。标志为几何示意，未复制设备序列号、卖家水印和标签。照片未完整展示的细节做了简化；位置、尺寸和接口细节可在下一轮调整。</aside>
</main>
<script>
const model=document.querySelector('#model'),viewport=document.querySelector('#viewport'),shell=document.querySelector('#shell'),angle=document.querySelector('#angle');
// Extrude a rounded rectangle so the corners remain solid at every viewing angle.
const outline=[],radius=25,cornerSteps=48;
for(const [cx,cz,start] of [[135,125,0],[-135,125,90],[-135,-125,180],[135,-125,270]]){for(let step=0;step<=cornerSteps;step++){const a=(start+step*90/cornerSteps)*Math.PI/180;outline.push([cx+radius*Math.cos(a),cz+radius*Math.sin(a)]);}}
for(let i=0;i<outline.length;i++){const [x,z]=outline[i],[nx,nz]=outline[(i+1)%outline.length],dx=nx-x,dz=nz-z,length=Math.hypot(dx,dz),yaw=Math.atan2(-dz,dx)*180/Math.PI+180;const panel=document.createElement('div');panel.className='face side-panel';panel.style.cssText=`width:${length+.45}px;height:80px;left:${-(length+.45)/2}px;top:-40px;transform:translate3d(${(x+nx)/2}px,0,${(z+nz)/2}px) rotateY(${yaw}deg)`;shell.append(panel);}

// One regular hexagon defines the rim, sectors and ribs, keeping every edge aligned.
const grille=document.querySelector('.grille');
const hex=r=>Array.from({length:6},(_,i)=>{const a=(-90+i*60)*Math.PI/180;return[100+r*Math.cos(a),100+r*Math.sin(a)];});
const points=vertices=>vertices.map(p=>p.join(',')).join(' '),outer=hex(94),inner=hex(87);
let grilleMarkup='<defs><filter id="paint-grain"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><linearGradient id="matte" x2=".8" y2="1"><stop stop-color="#333436"/><stop offset=".55" stop-color="#252628"/><stop offset="1" stop-color="#1b1c1e"/></linearGradient>';
for(let i=0;i<6;i++)grilleMarkup+=`<clipPath id="sector-${i}"><polygon points="100,100 ${points([inner[i],inner[(i+1)%6]])}"/></clipPath>`;
grilleMarkup+='<clipPath id="paint-boundary"><polygon points="' + points(outer) + '"/></clipPath></defs>';
grilleMarkup+=`<polygon points="${points(outer)}" fill="url(#matte)" stroke="#101113" stroke-width="3" stroke-linejoin="round"/><polygon points="${points(hex(91))}" fill="none" stroke="#4a4b4d" stroke-width=".7"/>`;
for(let i=0;i<6;i++){grilleMarkup+=`<g clip-path="url(#sector-${i})"><g transform="rotate(${i*60} 100 100)">`;for(let y=5;y<200;y+=7)grilleMarkup+=`<path d="M0 ${y}H200" stroke="#090a0c" stroke-width="3.5" stroke-linecap="round"/><path d="M0 ${y+2.2}H200" stroke="#555658" stroke-opacity=".55" stroke-width=".65"/>`;grilleMarkup+='</g></g>';}
for(const p of inner)grilleMarkup+=`<path d="M100 100L${p.join(' ')}" stroke="#2c2d2f" stroke-width="7"/>`;
grilleMarkup+=`<polygon points="${points(hex(19))}" fill="#2c2d2f"/><polygon points="${points(outer)}" fill="#fff" opacity=".055" clip-path="url(#paint-boundary)" filter="url(#paint-grain)"/>`;
grille.innerHTML=grilleMarkup;
let pitch=-24,yaw=-30,zoom=1,auto=false,last=0,drag=null;
function draw(){const responsive=innerWidth<600?.72:1;model.style.transform=`scale(${zoom*responsive}) rotateX(${pitch}deg) rotateY(${yaw}deg)`;angle.textContent=`X ${Math.round(pitch)}° / Y ${Math.round(yaw)%360}°`;}
viewport.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};viewport.setPointerCapture(e.pointerId);viewport.focus({preventScroll:true});});
viewport.addEventListener('pointermove',e=>{if(!drag)return;yaw+=(e.clientX-drag.x)*.5;pitch-=(e.clientY-drag.y)*.5;drag={x:e.clientX,y:e.clientY};draw();});
for(const name of ['pointerup','pointercancel','lostpointercapture'])viewport.addEventListener(name,()=>drag=null);
viewport.addEventListener('keydown',e=>{const keys={ArrowLeft:[0,-8],ArrowRight:[0,8],ArrowUp:[8,0],ArrowDown:[-8,0]};if(keys[e.key]){e.preventDefault();pitch+=keys[e.key][0];yaw+=keys[e.key][1];draw();}});
document.querySelectorAll('[data-view]').forEach(button=>button.onclick=()=>{const views={front:[-15,0],rear:[-15,180],top:[-90,0],bottom:[90,0],reset:[-24,-30]};[pitch,yaw]=views[button.dataset.view];draw();});
document.querySelector('#zoom').oninput=e=>{zoom=e.target.value/100;draw();};
document.querySelector('#auto').onclick=e=>{auto=!auto;e.currentTarget.setAttribute('aria-pressed',String(auto));};
function tick(time){if(auto&&!drag&&!document.hidden){yaw+=(time-last)*.012;draw();}last=time;requestAnimationFrame(tick);}window.addEventListener('resize',draw);draw();requestAnimationFrame(tick);
</script>
</html>
